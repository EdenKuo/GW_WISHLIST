name = "gw-wishlist"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 本地開發用的 D1 綁定（僅供 `wrangler dev` 使用）。
# 正式環境的 D1 綁定請在 Cloudflare 專案的
# Bindings 分頁內設定，不需要修改這個檔案也能部署。
[[d1_databases]]
binding = "DB"
database_name = "gw-wishlist-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
