name = "gw-wishlist"
pages_build_output_dir = "public"
compatibility_date = "2024-09-25"

# 本地開發用的 D1 綁定（僅供 `wrangler pages dev` 使用）。
# 正式環境的 D1 綁定請在 Cloudflare Pages 專案的
# Settings > Functions > D1 database bindings 內設定，
# 不需要修改這個檔案也能部署。
[[d1_databases]]
binding = "DB"
database_name = "gw-wishlist-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
