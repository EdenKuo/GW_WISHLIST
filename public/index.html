<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財鯨動向｜聽眾投稿</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>財鯨動向</h1>
      <p class="subtitle">留言、許願、給我們回饋 — 我們都在聽</p>
    </header>

    <form id="submission-form" class="form" novalidate>
      <div class="field">
        <label for="content">留言內容 <span class="required">*</span></label>
        <textarea
          id="content"
          name="content"
          maxlength="500"
          rows="6"
          placeholder="想對節目說的話、許願單集主題、任何回饋都歡迎……"
          required
        ></textarea>
        <div class="counter"><span id="char-count">0</span>/500</div>
      </div>

      <div class="field">
        <label for="nickname">暱稱（選填）</label>
        <input type="text" id="nickname" name="nickname" maxlength="50" placeholder="不填就是匿名喔">
      </div>

      <!-- honeypot：一般使用者看不到，機器人才會填 -->
      <div class="honeypot" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="submit-btn">送出投稿</button>
    </form>

    <div id="result" class="result" role="status" hidden></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
